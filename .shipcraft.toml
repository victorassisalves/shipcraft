# Shipcraft on its own repository: a 3-item trial from 2026-10-28 (shipcraft-v2
# metrics/dogfood-red-2026-10-28.md: red 99 s, hook p90 22.9 s). Metric: RED->main
# time against the 11 min median, false hook refusals, hook and red times.
# Revert: delete this file and .shipcraft/locks/.
shipcraft_min = "2.13"

[[suite]]
name = "acceptance"
root = "."
command = "acceptance/shipcraft.sh {junit}"
globs = ["acceptance/lib/**", "acceptance/tools/**", "acceptance/fixtures/**", "acceptance/stubs/**", "acceptance/*.sh"]
filter = "command"

[execution]
ci = "off"
# Dogfood step 2 (2026-10-29): the product's review replaces the hand-made Codex prompt.
# The QA brief runs the full battery (~12 min here), hence the longer timeout.
# Revert: review = "off" and drop [roles] and [review].
review = "local"

[roles]
review = "codex"

[review]
spec = "docs/spec.md"
timeout = 2400
