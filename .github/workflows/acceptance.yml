name: acceptance

# The offline black-box battery against nucleo/. Linux gates every PR by impact
# (acceptance/scope.sh): a PR that changes only docs runs nothing, one that changes only
# battery item files runs those items, anything else runs the whole battery in 18 shards,
# split by measured case duration (acceptance/durations.tsv). The core is built once, beside
# the scope job, and every shard downloads it. Main always runs the whole battery. macOS runs it once a day and on
# demand: GitHub's free macOS runners are few and slow to start.
# GitHub-hosted runners only: this is a public repository, so self-hosted runners
# must never be attached to it (a fork PR would run code on that machine).
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 5 macOS shards: a free account runs at most 5 macOS jobs at once.
  macos:
    if: github.event_name == 'schedule'
    name: macos ${{ matrix.shard }}/5
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
        of: [5]
    steps:
      - uses: actions/checkout@v4

      - name: Restore the fixture cache (npm, pip, Go)
        uses: actions/cache@v4
        with:
          # Package caches only: xdg and anything Shipcraft writes stay per run.
          path: |
            ${{ runner.temp }}/acceptance-cache/npm
            ${{ runner.temp }}/acceptance-cache/pip
            ${{ runner.temp }}/acceptance-cache/gopath/pkg/mod
          key: acceptance-cache-${{ runner.os }}-${{ hashFiles('acceptance/run.sh', 'acceptance/lib/v1.sh', 'acceptance/tools/item51.py', 'acceptance/fixtures/**/package*.json') }}
          restore-keys: acceptance-cache-${{ runner.os }}-

      - name: Set up Go (Go targets)
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Set up Node (vitest targets)
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up Python (pytest targets)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the core
        run: cargo build --release -j 4 --manifest-path nucleo/Cargo.toml

      - name: Run the acceptance suite (shard ${{ matrix.shard }}/${{ matrix.of }})
        env:
          SHIPCRAFT_ACCEPTANCE_JOBS: "4"
          SHIPCRAFT_ACCEPTANCE_CACHE: ${{ runner.temp }}/acceptance-cache
          SHIPCRAFT_ACCEPTANCE_SHARD: "${{ matrix.shard }}/${{ matrix.of }}"
          SHIPCRAFT_ACCEPTANCE_VERBOSE: "1"
        run: bash acceptance/run.sh "$PWD/nucleo/target/release/shipcraft" all

  # What this run covers: PRs by impact, everything else in full.
  scope:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
      cases: ${{ steps.scope.outputs.cases }}
      shards: ${{ steps.scope.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            bash acceptance/scope.sh "origin/$BASE_REF" HEAD | tee -a "$GITHUB_OUTPUT"
          else
            bash acceptance/scope.sh --full | tee -a "$GITHUB_OUTPUT"
          fi

  # The core, built once with a Rust cache, beside the scope job; the shards download it.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: nucleo
      - name: Build the core
        run: cargo build --release -j 4 --manifest-path nucleo/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: shipcraft-linux
          path: nucleo/target/release/shipcraft
          retention-days: 1

  linux:
    needs: [scope, build]
    if: needs.scope.outputs.mode != 'none'
    name: linux ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.scope.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore the fixture cache (npm, pip, Go)
        uses: actions/cache@v4
        with:
          # Package caches only: xdg and anything Shipcraft writes stay per run.
          path: |
            ${{ runner.temp }}/acceptance-cache/npm
            ${{ runner.temp }}/acceptance-cache/pip
            ${{ runner.temp }}/acceptance-cache/gopath/pkg/mod
          key: acceptance-cache-${{ runner.os }}-${{ hashFiles('acceptance/run.sh', 'acceptance/lib/v1.sh', 'acceptance/tools/item51.py', 'acceptance/fixtures/**/package*.json') }}
          restore-keys: acceptance-cache-${{ runner.os }}-

      - name: Set up Go (Go targets)
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Set up Node (vitest targets)
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up Python (pytest targets)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download the core
        uses: actions/download-artifact@v4
        with:
          name: shipcraft-linux
          path: nucleo/target/release
      - run: chmod +x nucleo/target/release/shipcraft

      - name: Run the acceptance suite (shard ${{ matrix.shard }}/${{ strategy.job-total }}, ${{ needs.scope.outputs.mode }})
        env:
          SHIPCRAFT_ACCEPTANCE_JOBS: "4"
          SHIPCRAFT_ACCEPTANCE_CACHE: ${{ runner.temp }}/acceptance-cache
          SHIPCRAFT_ACCEPTANCE_SHARD: "${{ matrix.shard }}/${{ strategy.job-total }}"
          SHIPCRAFT_ACCEPTANCE_CASES: ${{ needs.scope.outputs.cases }}
          SHIPCRAFT_ACCEPTANCE_VERBOSE: "1"
          SHIPCRAFT_ACCEPTANCE_JUNIT: ${{ runner.temp }}/junit-${{ matrix.shard }}.xml
        run: bash acceptance/run.sh "$PWD/nucleo/target/release/shipcraft" all

      # Each case's time, to keep acceptance/durations.tsv current (acceptance/tools/durations.py).
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-${{ matrix.shard }}
          path: ${{ runner.temp }}/junit-${{ matrix.shard }}.xml
          retention-days: 14
          if-no-files-found: ignore

  # The single check branch protection requires: green when every Linux shard passed,
  # or when the scope found nothing the battery covers.
  gate:
    name: acceptance
    needs: [scope, linux]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every Linux shard passed, or nothing to run
        run: |
          test "${{ needs.scope.result }}" = success
          if [ "${{ needs.scope.outputs.mode }}" = none ]; then
            test "${{ needs.linux.result }}" = skipped
          else
            test "${{ needs.linux.result }}" = success
          fi
