[package]
license = "Apache-2.0"
name = "shipcraft"
version = "2.8.0"
edition = "2021"
publish = false
description = "Shipcraft v2 core: the GREEN cannot pass the suite by changing, deleting or skipping the RED's tests."

[dependencies]
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
sha2 = "0.10"
toml = "0.9"
unsafe-libyaml-norway = "0.2"

[profile.release]
strip = true
